# Production address (Vercel). The old https://coolloic.github.io/blog/ redirects here.
baseURL: https://aitanyan.com/
locale: zh-cn
title: AI调研员
theme: evo
hasCJKLanguage: true

taxonomies:
  category: categories
  tag: tags

enableRobotsTXT: true
# Synced WeChat text can contain things like <think>; Goldmark drops raw HTML, which is fine,
# but its warning would fail the --panicOnWarning build.
ignoreLogs: ["warning-goldmark-raw-html"]
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

params:
  env: production
  company: "L.J.K Consultant Limited" # registered company: footer copyright and JSON-LD publisher legalName
  description: "AI调研员：把前沿 AI 讲清楚。公众号文章的长期归档，附英文技术笔记与 AI Wiki。"
  imageBase: "https://aitanyan.com/img" # Vercel rewrites /img/* to the R2 bucket (vercel.json)
  imageWidths: [480, 960, 1440] # WebP sizes made by tools/wx-sync and offered via srcset (_partials/picture.html)
  shareImage: "images/og-default.png" # fallback og:image (1200x630) for pages without a cover
  # Search-engine site verification codes; a meta tag is emitted only when a value is set.
  verification:
    google: ""
    bing: ""
    baidu: ""
  author: Loic
  defaultTheme: auto # follows the reader's light/dark preference
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: false
  mainSections: [articles, posts] # keep wiki pages off the home page, archive and post nav

  homeInfoParams:
    Title: "Hi, I'm Loic 👋"
    Content: "Technical writing on cutting-edge AI: models, agents, tooling, and what I learn building with them."

  socialIcons:
    - name: cv
      title: CV
      url: "https://coolloic.github.io/"
    - name: github
      url: "https://github.com/coolloic"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/coolloic/blog/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true

menu:
  # Labels come from data/i18n/<lang>.yaml (nav_<identifier>) so they follow the page language.
  main:
    - {identifier: home, name: 首页, url: "", weight: 10}
    - {identifier: articles, name: 科普, url: "articles/", weight: 20}
    - {identifier: topics, name: 专题, url: "topics/", weight: 25}
    - {identifier: glossary, name: 名词, url: "glossary/", weight: 27}
    - {identifier: notes, name: 技术笔记, url: "notes/", weight: 30}
    - {identifier: archives, name: 归档, url: "archives/", weight: 40}
    - {identifier: search, name: 搜索, url: "search/", weight: 50}
    - {identifier: about, name: 关于, url: "about/", weight: 60}
  footer:
    - {identifier: cv, name: CV, url: "https://coolloic.github.io/", weight: 10}
    - {identifier: now, name: Now, url: "now/", weight: 20}
    - {identifier: methodology, name: 调研方法, url: "methodology/", weight: 22}
    - {identifier: corrections, name: 更正与反馈, url: "corrections/", weight: 24}
    - {identifier: rss, name: RSS, url: "index.xml", weight: 30}
    - {identifier: github, name: GitHub, url: "https://github.com/coolloic", weight: 40}

markup:
  goldmark:
    extensions:
      # Synced Chinese text: "**加粗。**\\ 后文" — an escaped space closes emphasis next to CJK
      # punctuation and renders as nothing (tools/wx-sync emits it).
      cjk:
        enable: true
        escapedSpace: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true

# Don't fall back to lastmod for a page's date: wiki pages have only lastmod, and a
# lastmod that is still "tomorrow" in UTC would make Hugo treat them as future and drop them.
frontmatter:
  date: ["date", "publishDate"]
