# Change baseURL to your real address once deployed,
# e.g. https://<github-username>.github.io/blog/ or a custom domain.
baseURL: https://coolloic.github.io/blog/
locale: zh-cn
title: AI进化调研员
theme: evo
hasCJKLanguage: true

taxonomies:
  category: categories
  tag: tags

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

params:
  env: production
  description: "AI进化调研员：把前沿 AI 讲清楚。公众号文章的长期归档，附英文技术笔记与 AI Wiki。"
  imageBase: "https://pub-PLACEHOLDER.r2.dev"
  author: Loic
  defaultTheme: auto # follows the reader's light/dark preference
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: false
  mainSections: [articles, posts] # keep wiki pages off the home page, archive and post nav

  homeInfoParams:
    Title: "Hi, I'm Loic 👋"
    Content: "Technical writing on cutting-edge AI: models, agents, tooling, and what I learn building with them."

  socialIcons:
    - name: cv
      title: CV
      url: "https://coolloic.github.io/"
    - name: github
      url: "https://github.com/coolloic"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/coolloic/blog/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: wiki
      name: Wiki
      url: /wiki/
      weight: 15
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: now
      name: Now
      url: /now/
      weight: 45
    - identifier: about
      name: About
      url: /about/
      weight: 50
    - identifier: cv
      name: CV
      url: https://coolloic.github.io/
      weight: 60

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true

# Don't fall back to lastmod for a page's date: wiki pages have only lastmod, and a
# lastmod that is still "tomorrow" in UTC would make Hugo treat them as future and drop them.
frontmatter:
  date: ["date", "publishDate"]
