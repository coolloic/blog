name: Publish redirects at the old GitHub Pages address

# The blog lives at https://aitanyan.com/ (Vercel, deployed manually with `vercel deploy --prod`).
# This workflow only publishes redirect pages for https://coolloic.github.io/blog/ so old links and search
# results land on the new domain. Run it by hand after adding or moving pages: Actions → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - run: hugo --gc --minify --panicOnWarning --baseURL "https://aitanyan.com/"
      - run: python3 scripts/make-redirects.py public redirects https://aitanyan.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirects
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
