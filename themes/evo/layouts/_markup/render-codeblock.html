{{- /* Highlighted code block with a language label and a copy button (enabled by js/code-copy.js). */ -}}
{{- $lang := .Type | default "text" -}}
<div class="code-block">
  <div class="code-block__bar"><span class="code-block__lang">{{ $lang }}</span><button class="code-block__copy" type="button" data-copy hidden>{{ partial "t.html" (dict "page" .Page "key" "copy") }}</button></div>
  {{ transform.Highlight .Inner $lang .Options }}
</div>
