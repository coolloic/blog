{{ define "main" }}
<article class="article article--page">
  <div class="container">
    {{ partial "crumbs.html" . }}
    <header class="article__head"><h1>{{ .Title }}</h1>{{ with .Params.summary }}<p class="article__summary">{{ . }}</p>{{ end }}</header>
    <div class="prose">{{ .Content }}</div>
  </div>
</article>
{{ end }}
