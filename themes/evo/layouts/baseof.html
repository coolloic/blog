{{- $lang := partial "lang.html" . -}}
<!doctype html>
<html lang="{{ index hugo.Data.i18n $lang "html_lang" }}" data-lang="{{ $lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">{{ partial "t.html" (dict "page" . "key" "skip_link") }}</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
