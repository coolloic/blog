{{- if or .PrevInSection .NextInSection }}
<nav class="post-nav" aria-label="{{ partial "t.html" (dict "page" . "key" "post_nav") }}">
  {{ with .NextInSection }}<a class="post-nav__prev" href="{{ .RelPermalink }}"><small>← {{ partial "t.html" (dict "page" $ "key" "prev_article") }}</small><span>{{ .Title }}</span></a>{{ end }}
  {{ with .PrevInSection }}<a class="post-nav__next" href="{{ .RelPermalink }}"><small>{{ partial "t.html" (dict "page" $ "key" "next_article") }} →</small><span>{{ .Title }}</span></a>{{ end }}
</nav>
{{- end }}
