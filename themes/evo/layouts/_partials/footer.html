<footer class="site-footer" lang="zh-CN">
  <div class="container site-footer__inner">
    <div class="site-footer__top">
      <a class="follow-mini" href="{{ "about/" | relURL }}">
        <img src="{{ "images/wechat-qr.png" | relURL }}" width="48" height="48" alt="" loading="lazy">
        <span><strong>{{ partial "t.html" (dict "page" site.Home "key" "footer_follow") }}</strong><small>{{ partial "t.html" (dict "page" site.Home "key" "footer_follow_sub") }}</small></span>
      </a>
      <nav class="site-footer__links" aria-label="{{ partial "t.html" (dict "page" site.Home "key" "footer_label") }}">
        {{- range site.Menus.footer }}
        <a href="{{ .URL | relURL }}"{{ if strings.HasPrefix .URL "http" }} rel="noopener"{{ end }}>{{ .Name }}</a>
        {{- end }}
      </nav>
    </div>
    <p class="site-footer__copy">{{ printf (partial "t.html" (dict "page" site.Home "key" "copyright")) now.Year }}</p>
  </div>
</footer>
